<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área de Clientes | Solucions i Disseny</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 25px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #f28c00;
        }

        .card {
            background: #1c1c1c;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #333;
            box-shadow: 0 15px 40px rgba(0,0,0,.4);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: white;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #f28c00;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #f28c00;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ff9f1c;
        }

        #mensaje {
            margin-top: 20px;
            text-align: center;
            color: #ff7777;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            text-decoration: none;
        }

        .volver:hover {
            color: #f28c00;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">
        <h1>SOLUCIONS <span>I</span> DISSENY</h1>
    </div>

    <div class="card">

        <h2>Área de Clientes</h2>

        <p class="subtitle">
            Consulta el estado de tu reforma
        </p>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="tu@email.com"
                required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                placeholder="Tu contraseña"
                required
            >

            <button type="submit">
                INICIAR SESIÓN
            </button>

        </form>

        <p style="text-align: center; margin-top: 20px;">
        <a href="#" id="olvidoPassword">
        ¿Has olvidado tu contraseña?
        </a>
        </p>

        <p style="margin-top: 20px;">
        ¿Eres nuevo?
        <a href="registro.html">Crear cuenta</a>
        </p>

        <div id="mensaje"></div>

        <a href="../index.html" class="volver">
            ← Volver a la web
        </a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script>

const formulario = document.getElementById("loginForm");
const mensaje = document.getElementById("mensaje");

formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    mensaje.textContent = "Iniciando sesión...";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {

        mensaje.textContent = "Email o contraseña incorrectos.";

        console.error(error);

        return;
    }

    window.location.href = "dashboard.html";

});

document.getElementById("olvidoPassword").addEventListener("click", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value;

    if (!email) {
        mensaje.textContent = "Escribe primero tu correo electrónico.";
        return;
    }

    mensaje.textContent = "Enviando correo de recuperación...";

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: "http://127.0.0.1:5500/cambiar-password.html"
    });

    if (error) {
        console.error(error);
        mensaje.textContent = "Error: " + error.message;
        return;
    }

    mensaje.textContent =
        "Te hemos enviado un correo para cambiar tu contraseña.";
});

</script>
</body>
</html>
