<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambiar contraseña</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            width: 90%;
            max-width: 400px;
            background: #1c1c1c;
            padding: 30px;
            border-radius: 14px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #ff9800;
            color: #000;
            font-weight: bold;
        }

        #mensaje {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #ff9800;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Nueva contraseña</h1>

    <form id="formulario">

        <label for="password">
            Nueva contraseña
        </label>

        <input
            type="password"
            id="password"
            placeholder="Nueva contraseña"
            minlength="6"
            required
        >

        <label for="confirmar">
            Repite la contraseña
        </label>

        <input
            type="password"
            id="confirmar"
            placeholder="Repite la contraseña"
            minlength="6"
            required
        >

        <button type="submit">
            CAMBIAR CONTRASEÑA
        </button>

    </form>

    <div id="mensaje"></div>

    <p style="margin-top: 20px; text-align: center;">
        <a href="login.html">← Volver al inicio de sesión</a>
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>

const formulario = document.getElementById("formulario");
const mensaje = document.getElementById("mensaje");

supabaseClient.auth.onAuthStateChange((event, session) => {

    if (event === "PASSWORD_RECOVERY") {

        mensaje.textContent =
            "Escribe tu nueva contraseña.";

    }

});

formulario.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =
        document.getElementById("password").value;

    const confirmar =
        document.getElementById("confirmar").value;

    if (password !== confirmar) {

        mensaje.textContent =
            "Las contraseñas no coinciden.";

        return;
    }

    mensaje.textContent =
        "Cambiando contraseña...";

    const { error } =
        await supabaseClient.auth.updateUser({
            password: password
        });

    if (error) {

        console.error(error);

        mensaje.textContent =
            "Error: " + error.message;

        return;
    }

    mensaje.textContent =
        "Contraseña cambiada correctamente.";

    formulario.reset();

});

</script>

</body>
</html>
